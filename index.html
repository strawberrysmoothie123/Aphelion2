<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 Big 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#14202e;
    --ink-dim:rgba(20,32,46,0.80);
    --ink-faint:rgba(20,32,46,0.58);
    --bubble-bg:#3f9bee;
    --bubble-bg-soft:#3f9bee;
    --bubble-border:#0b6fe0;
    --gold:#0b6fe0;
    --gold-glow:rgba(11,111,224,0.38);
    --busy-bg:rgba(148,163,184,0.22);
    --busy-border:rgba(100,116,139,0.4);
    --panel:#dcedfd;
    --panel-hover:#c5e2fa;
    --panel-border:rgba(11,111,224,0.55);
    --shadow-soft:0 6px 16px rgba(11,111,224,0.18);
    --font-display:'Gowun Batang', serif;
    --font-body:'PretendardVariable', -apple-system, 'Malgun Gothic', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    font-family:var(--font-body);
    color:var(--ink);
    background:#ffffff;
    position:relative;
  }
  #deco{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;}
  #app{position:relative; z-index:2; width:100%; height:100%;}

  #restart{position:fixed; top:22px; left:26px; z-index:20; font-size:12.5px; letter-spacing:.02em; color:var(--ink-faint); background:none; border:none; cursor:pointer; font-family:var(--font-body); transition:color .2s ease;}
  #restart:hover{color:var(--ink-dim);}
  #connect-btn{position:fixed; top:52px; left:26px; z-index:20; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; color:var(--ink-faint); background:var(--panel); border:1px solid var(--panel-border); border-radius:999px; padding:6px 13px; cursor:pointer; transition:border-color .2s ease, color .2s ease;}
  #connect-btn.connected{border-color:var(--gold); color:var(--gold);}
  #back-btn{position:fixed; top:82px; left:26px; z-index:20; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; color:var(--ink-faint); background:var(--panel); border:1px solid var(--panel-border); border-radius:999px; padding:6px 13px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .3s ease, border-color .2s ease;}
  #back-btn.show{opacity:1; pointer-events:auto;}
  #back-btn:hover{border-color:var(--gold); color:var(--gold);}
  #stage-label{position:fixed; top:22px; right:26px; z-index:20; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase;}

  #greeting-wrap{position:fixed; top:16%; left:50%; transform:translateX(-50%); text-align:center; z-index:5; width:90%; max-width:640px; transition:opacity .5s ease, transform .5s ease;}
  #greeting{font-family:var(--font-display); font-weight:700; font-size:clamp(24px,4vw,34px); color:var(--ink);}
  #subgreeting{margin-top:10px; font-size:clamp(13px,1.6vw,15px); color:var(--ink-dim); font-weight:300; letter-spacing:.01em;}
  #carry-note{margin-top:6px; font-size:11.5px; color:var(--gold); opacity:0; transition:opacity .4s ease;}
  #carry-note.show{opacity:.85;}

  #instruction-2{position:fixed; top:12%; left:50%; transform:translateX(-50%); text-align:center; z-index:5; width:90%; max-width:640px; opacity:0; pointer-events:none; transition:opacity .5s ease;}
  #instruction-2 .head{font-family:var(--font-display); font-weight:700; font-size:clamp(20px,3.4vw,28px); color:var(--ink);}
  #instruction-2 .sub{margin-top:8px; font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; color:var(--gold);}
  #instruction-2.active{opacity:1; pointer-events:auto;}

  #input-circle-wrap{position:fixed; top:34%; left:50%; transform:translate(-50%,-50%); z-index:6; transition:opacity .5s ease, transform .5s ease;}
  #input-ring{width:190px; height:190px; border-radius:50%; border:1px solid var(--bubble-border); background:radial-gradient(circle at 50% 40%, rgba(79,167,224,0.10), rgba(79,167,224,0.02)); display:flex; align-items:center; justify-content:center; box-shadow:0 0 50px rgba(79,167,224,0.12);}
  #brain-input{width:150px; text-align:center; background:none; border:none; outline:none; color:var(--ink); font-family:var(--font-body); font-size:14.5px; caret-color:var(--gold);}
  #brain-input::placeholder{color:var(--ink-faint);}
  #hint-text{position:fixed; top:calc(34% + 118px); left:50%; transform:translateX(-50%); z-index:6; font-size:11.5px; color:var(--ink-faint); letter-spacing:.02em; transition:opacity .4s ease;}
  .fade-out{opacity:0 !important; transform:translate(-50%,-58%) !important; pointer-events:none !important;}

  #bubble-layer{position:fixed; inset:0; z-index:3;}
  .bubble{position:absolute; top:0; left:0; padding:10px; border-radius:50%; background:var(--bubble-bg-soft); border:2px solid var(--bubble-border); color:#ffffff; line-height:1.32; text-align:center; word-break:keep-all; box-shadow:var(--shadow-soft); user-select:none; cursor:pointer; transition:box-shadow .25s ease, border-color .25s ease, opacity .5s ease;}
  .bubble.stale{animation:stale-blink 2.4s ease-in-out infinite;}
  @keyframes stale-blink{
    0%,100%{ box-shadow:var(--shadow-soft); border-color:var(--bubble-border); }
    50%{ box-shadow:var(--shadow-soft), 0 0 22px var(--gold-glow); border-color:var(--gold); }
  }
  .bubble:hover{border-color:#ffffff;}
  .bubble.selected{border-color:#ffffff; box-shadow:0 0 0 2px #ffffff, 0 0 22px rgba(255,255,255,0.6);}
  .bubble.selected.stale{animation-play-state:paused;}
  .bubble.frozen{border-color:#ffb020; box-shadow:0 0 0 2px #ffb020, var(--shadow-soft);}
  .bubble.frozen.stale{animation-play-state:paused;}
  .bubble-action{position:absolute; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; z-index:4; box-shadow:0 2px 8px rgba(70,120,170,0.25);}
  .bubble-action.delete{top:-8px; right:-8px; background:#e2645a; color:#fff;}
  .bubble-text{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; max-width:100%;}
  .bubble-action.edit{bottom:-8px; right:-8px; background:#ffffff; border:1px solid var(--panel-border); color:var(--ink);}
  .bubble-edit-input{width:80%; background:transparent; border:none; border-bottom:1px solid #ffffff; color:#ffffff; text-align:center; font-family:var(--font-body); font-size:inherit; outline:none;}
  .badge{position:absolute; top:-9px; left:-9px; width:24px; height:24px; border-radius:50%; background:#ffffff; color:var(--gold); font-family:var(--font-mono); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(11,111,224,0.35);}

  #next-btn{position:fixed; bottom:32px; right:34px; z-index:20; font-family:var(--font-body); font-size:13.5px; letter-spacing:.01em; color:#ffffff; background:var(--gold); border:none; border-radius:999px; padding:12px 22px; cursor:pointer; opacity:0; transform:translateY(8px); pointer-events:none; box-shadow:var(--shadow-soft); transition:opacity .4s ease, transform .4s ease, background .2s ease, box-shadow .2s ease;}
  #next-btn.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  #next-btn:hover{background:#0a5fc4; box-shadow:0 8px 22px var(--gold-glow);}
  #counter{position:fixed; bottom:36px; left:34px; z-index:20; font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); opacity:0; transition:opacity .4s ease;}
  #counter.show{opacity:1;}

  #stage3{position:fixed; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; opacity:0; pointer-events:none; transition:opacity .6s ease; padding:70px 24px 24px;}
  #stage3.active{opacity:1; pointer-events:auto;}
  #stage3 .head{font-family:var(--font-display); font-weight:700; font-size:clamp(18px,2.8vw,24px); color:var(--ink); margin-bottom:4px; text-align:center;}
  #stage3 .subhead{font-size:11.5px; color:var(--ink-faint); margin-bottom:18px; text-align:center; font-family:var(--font-mono); letter-spacing:.04em;}

  #planner{display:flex; gap:22px; width:100%; max-width:820px; flex:1; min-height:0;}
  #tray{width:190px; display:flex; flex-direction:column; gap:12px; flex-shrink:0;}
  #tray .tray-label{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); letter-spacing:.06em; margin-bottom:2px;}
  .tray-item{padding:12px 14px; border-radius:14px; background:var(--gold); color:#ffffff; border:2px dashed rgba(255,255,255,0.55); font-size:13px; line-height:1.4; word-break:keep-all; cursor:grab; user-select:none; touch-action:none; box-shadow:var(--shadow-soft);}
  .tray-item .num{font-family:var(--font-mono); font-size:11px; color:#ffffff; font-weight:700; margin-right:6px;}
  .tray-item.placed{opacity:.25; pointer-events:none;}

  #timeline-wrap{flex:1; position:relative; overflow-y:auto; border-radius:16px; background:rgba(11,111,224,0.06); border:1px solid var(--panel-border);}
  #timeline{position:relative; width:100%;}
  .hour-line{position:absolute; left:52px; right:10px; border-top:1px solid rgba(60,120,170,0.14);}
  .hour-label{position:absolute; left:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); transform:translateY(-50%);}
  .busy-block{position:absolute; left:56px; right:10px; background:#e2e8f0; border:1px solid #94a3b8; border-radius:8px; padding:4px 8px; font-size:11px; color:#475569; overflow:hidden;}
  .placed-block{position:absolute; left:56px; right:10px; border-radius:10px; background:var(--gold); border:2px solid #ffffff; padding:6px 10px; font-size:12px; color:#ffffff; cursor:grab; touch-action:none; box-shadow:0 4px 14px rgba(11,111,224,0.35);}
  .placed-block .title{font-weight:500;}
  .placed-block .time{font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.85); margin-top:2px;}
  .dur-controls{position:absolute; right:6px; top:6px; display:flex; gap:3px;}
  .dur-btn{width:16px; height:16px; border-radius:50%; background:#ffffff; border:none; color:var(--gold); font-size:10px; line-height:1; cursor:pointer; font-weight:700;}

  #empty-note{position:absolute; top:10px; left:56px; right:10px; font-size:11.5px; color:var(--ink-faint);}

  #confirm-btn{margin-top:20px; font-family:var(--font-body); font-size:14px; color:#ffffff; background:var(--gold); border:none; border-radius:999px; padding:13px 28px; cursor:pointer; letter-spacing:.01em; transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;}
  #confirm-btn:hover{transform:translateY(-1px); box-shadow:0 8px 22px var(--gold-glow);}
  #confirm-btn:disabled{opacity:.3; pointer-events:none;}
  #sent-msg{margin-top:16px; width:100%; max-width:520px; opacity:0; transition:opacity .4s ease;}
  #sent-msg.show{opacity:1;}
  #sent-msg .note{font-size:12px; color:var(--ink-dim); margin-bottom:8px; text-align:center;}
  #sent-msg .msg-box{background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:12px 14px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink); white-space:pre-wrap; text-align:left; line-height:1.6;}
  #copy-btn{display:block; margin:10px auto 0; font-family:var(--font-body); font-size:12.5px; color:var(--ink); background:var(--panel); border:1px solid var(--panel-border); border-radius:999px; padding:8px 18px; cursor:pointer; transition:background .2s ease, border-color .2s ease;}
  #copy-btn:hover{background:var(--panel-hover); border-color:var(--gold);}
  #copy-btn.copied{border-color:var(--gold); color:var(--gold);}
  #copy-btn.hidden{display:none;}
  #extra-btn{display:none; margin:14px auto 0; font-family:var(--font-body); font-size:13px; color:var(--ink); background:var(--panel); border:1px solid var(--panel-border); border-radius:999px; padding:10px 20px; cursor:pointer; transition:border-color .2s ease;}
  #extra-btn.show{display:block;}
  #extra-btn:hover{border-color:var(--gold);}

  @media (prefers-reduced-motion: reduce){ .bubble{transition:none;} }
</style>
</head>
<body>
<div id="deco">
  <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- bottom-left overlapping ring cluster -->
    <g opacity="0.9">
      <circle cx="70" cy="760" r="150" fill="none" stroke="#0b6fe0" stroke-width="34" opacity="0.14"/>
      <circle cx="190" cy="700" r="130" fill="#3f9bee" opacity="0.10"/>
      <circle cx="230" cy="800" r="110" fill="none" stroke="#0b6fe0" stroke-width="2" opacity="0.30"/>
      <circle cx="150" cy="830" r="70" fill="#0b6fe0" opacity="0.08"/>
    </g>
    <!-- top-right overlapping ring cluster -->
    <g opacity="0.9">
      <circle cx="1330" cy="90" r="120" fill="none" stroke="#0b6fe0" stroke-width="28" opacity="0.14"/>
      <circle cx="1250" cy="150" r="95" fill="#3f9bee" opacity="0.10"/>
      <circle cx="1370" cy="180" r="70" fill="none" stroke="#0b6fe0" stroke-width="2" opacity="0.30"/>
      <circle cx="1200" cy="70" r="10" fill="#0b6fe0" opacity="0.35"/>
      <circle cx="1120" cy="120" r="6" fill="#0b6fe0" opacity="0.3"/>
    </g>
    <!-- small scattered accent dots -->
    <circle cx="60" cy="120" r="8" fill="#0b6fe0" opacity="0.25"/>
    <circle cx="110" cy="90" r="4" fill="#0b6fe0" opacity="0.3"/>
    <circle cx="1380" cy="740" r="14" fill="none" stroke="#0b6fe0" stroke-width="2" opacity="0.3"/>
    <circle cx="1340" cy="800" r="6" fill="#0b6fe0" opacity="0.3"/>
    <!-- dot grid, top-left -->
    <g opacity="0.35">
      <circle cx="40" cy="40" r="2.5" fill="#0b6fe0"/><circle cx="56" cy="40" r="2.5" fill="#0b6fe0"/><circle cx="72" cy="40" r="2.5" fill="#0b6fe0"/>
      <circle cx="40" cy="56" r="2.5" fill="#0b6fe0"/><circle cx="56" cy="56" r="2.5" fill="#0b6fe0"/><circle cx="72" cy="56" r="2.5" fill="#0b6fe0"/>
    </g>
    <!-- dot grid, bottom-right -->
    <g opacity="0.35">
      <circle cx="1370" cy="860" r="2.5" fill="#0b6fe0"/><circle cx="1386" cy="860" r="2.5" fill="#0b6fe0"/><circle cx="1402" cy="860" r="2.5" fill="#0b6fe0"/>
      <circle cx="1370" cy="876" r="2.5" fill="#0b6fe0"/><circle cx="1386" cy="876" r="2.5" fill="#0b6fe0"/><circle cx="1402" cy="876" r="2.5" fill="#0b6fe0"/>
    </g>
  </svg>
</div>
<div id="app">

  <button id="restart">↺ 처음 화면으로</button>
  <button id="connect-btn">구글 캘린더 연결</button>
  <button id="back-btn">← 뒤로</button>
  <div id="stage-label">STAGE <span id="stage-num">1</span> / 3</div>

  <div id="greeting-wrap">
    <div id="greeting"></div>
    <div id="subgreeting">오늘 머릿속에 있는 걸 다 꺼내봐. 순서는 상관없어.</div>
    <div id="carry-note"></div>
  </div>

  <div id="instruction-2">
    <div class="head" id="instruction-2-head">이 중에서, 진짜 중요한 세 가지만.</div>
    <div class="sub" id="instruction-2-sub">버블을 눌러서 골라줘</div>
  </div>

  <div id="input-circle-wrap">
    <div id="input-ring">
      <input id="brain-input" type="text" placeholder="생각나는 대로, Enter" autocomplete="off" />
    </div>
  </div>
  <div id="hint-text">Enter를 누르면 풍선처럼 떠올라</div>

  <div id="bubble-layer"></div>

  <div id="counter">선택 0 / 3</div>
  <button id="next-btn">Big 3 고르러 가기 →</button>

  <div id="stage3">
    <div class="head">오늘의 Big 3, 시간을 배정하자</div>
    <div class="subhead" id="date-label"></div>
    <div id="planner">
      <div id="tray">
        <div class="tray-label">배정 안 됨 — 드래그해서 타임라인에 놓기</div>
        <div id="tray-items"></div>
      </div>
      <div id="timeline-wrap">
        <div id="timeline"></div>
      </div>
    </div>
    <button id="confirm-btn" disabled>구글 캘린더에 반영하기</button>
    <div id="sent-msg">
      <div class="note" id="sent-note"></div>
      <div class="msg-box" id="msg-box"></div>
      <button id="copy-btn">문구 복사하기</button>
    </div>
    <button id="extra-btn">+ 추가로 할 일 배정하기</button>
  </div>

</div>

<script>
(function(){
  /* SYNC_EVENTS_START */
  let todaysEvents = [];
  /* SYNC_EVENTS_END */

  const STORAGE_KEY = 'pending-bubbles';
  const RANGE_START_MIN = 4*60; // display range starts at 04:00
  const DAY_START = 0;
  const DAY_END = 24*60; // full 24h span: 04:00 today -> 04:00 tomorrow
  const TOP_PAD = 16; // breathing room so the first hour block doesn't sit flush against the rounded edge
  const SNAP = 15;
  const STALE_DAYS = 3;

  let stage = 1;
  let bubbles = [];
  let selectedOrder = [];
  let idCounter = 0;
  let placements = {};
  let selectionMode = 'big3'; // 'big3' (exactly 3) or 'extra' (1 or more)

  const bubbleLayer = document.getElementById('bubble-layer');
  const input = document.getElementById('brain-input');
  const nextBtn = document.getElementById('next-btn');
  const counterEl = document.getElementById('counter');
  const stageNum = document.getElementById('stage-num');
  const greetingWrap = document.getElementById('greeting-wrap');
  const inputWrap = document.getElementById('input-circle-wrap');
  const hintText = document.getElementById('hint-text');
  const instruction2 = document.getElementById('instruction-2');
  const instr2Head = document.getElementById('instruction-2-head');
  const instr2Sub = document.getElementById('instruction-2-sub');
  const stage3 = document.getElementById('stage3');
  const restartBtn = document.getElementById('restart');
  const carryNote = document.getElementById('carry-note');
  const backBtn = document.getElementById('back-btn');
  const extraBtn = document.getElementById('extra-btn');

  // ---------- Google Calendar OAuth ----------
  const CLIENT_ID = '424662232399-0rubq90508i8a1e11bp59lg866o7gtas.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
  let accessToken = null;
  let tokenClient = null;
  const connectBtn = document.getElementById('connect-btn');

  function markConnected(){
    connectBtn.textContent = '캘린더 연결됨 ✓';
    connectBtn.classList.add('connected');
  }
  function initGoogleAuth(){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (resp)=>{
        if(resp.error){ console.warn('auth error', resp); connectBtn.textContent='연결 실패 — 다시 시도'; return; }
        accessToken = resp.access_token;
        try{ localStorage.setItem('gcal-token', accessToken); }catch(e){}
        markConnected();
      }
    });
    connectBtn.addEventListener('click', ()=>{
      tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
    });
    try{
      const saved = localStorage.getItem('gcal-token');
      if(saved){ accessToken = saved; markConnected(); }
    }catch(e){}
  }
  function waitForGIS(retries){
    if(window.google && google.accounts && google.accounts.oauth2){ initGoogleAuth(); }
    else if(retries>0){ setTimeout(()=>waitForGIS(retries-1), 200); }
    else{ connectBtn.textContent = 'Google 로그인 로드 실패'; }
  }

  // ---------- greeting ----------
  const now = new Date();
  const greetText = 'Jerry, 오늘 너의 하루를 함께 만들어가보자';
  document.getElementById('greeting').textContent = greetText;
  document.getElementById('date-label').textContent =
    now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');

  input.focus();
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && input.value.trim().length>0){
      addBubble(input.value.trim(), true);
      input.value='';
      persistPending();
    }
  });

  async function loadPending(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const list = JSON.parse(raw);
        if(Array.isArray(list) && list.length>0){
          list.forEach(item=>addBubble(item.text, false, item.createdAt));
          carryNote.textContent = `어제 못 끝낸 ${list.length}개가 계속 떠 있어`;
          carryNote.classList.add('show');
          updateStage1Gate();
        }
      }
    }catch(e){ console.warn('저장된 데이터 불러오기 실패', e); }
  }
  function persistPending(){
    try{
      const list = bubbles.map(b=>({text:b.text, createdAt:b.createdAt}));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }catch(e){ console.warn('storage save failed', e); }
  }

  function addBubble(text, fromCenter, createdAt){
    const id = 'b'+(idCounter++);
    const created = createdAt || new Date().toISOString();
    let cx, cy;
    if(fromCenter){ cx = window.innerWidth/2; cy = window.innerHeight*0.34; }
    else { cx = Math.random()*window.innerWidth; cy = 200 + Math.random()*(window.innerHeight-400); }
    const angle = Math.random()*Math.PI*2;
    const burstSpeed = 1.6 + Math.random()*0.8;

    // bigger, more visible bubbles
    const r = Math.max(58, Math.min(112, 48 + Math.sqrt(text.length)*10));
    const fontSize = text.length>16 ? 13.5 : text.length>9 ? 14.5 : 16;

    const daysOld = Math.floor((Date.now()-new Date(created).getTime())/86400000);
    const isStale = daysOld >= STALE_DAYS;

    const el = document.createElement('div');
    el.className = 'bubble' + (isStale ? ' stale' : '');
    el.style.width = (r*2)+'px';
    el.style.height = (r*2)+'px';
    el.style.fontSize = fontSize+'px';
    el.style.display='flex'; el.style.alignItems='center'; el.style.justifyContent='center';
    const textSpan = document.createElement('span');
    textSpan.className = 'bubble-text';
    textSpan.textContent = text;
    el.appendChild(textSpan);
    bubbleLayer.appendChild(el);

    const bubbleObj = { id, text, el, textEl:textSpan, createdAt:created, x:cx, y:cy, vx:Math.cos(angle)*burstSpeed, vy:Math.sin(angle)*burstSpeed, r, selected:false, frozen:false };
    bubbles.push(bubbleObj);
    el.title = '클릭하면 멈춰서 수정하거나 지울 수 있어';
    el.addEventListener('click', (e)=>handleBubbleClick(bubbleObj, e));
    updateStage1Gate();
  }

  function updateStage1Gate(){
    if(stage===1){
      if(bubbles.length>=3){ nextBtn.textContent='Big 3 고르러 가기 →'; nextBtn.classList.add('show'); }
      else nextBtn.classList.remove('show');
    }
  }

  const maxSpeed=0.34, damping=-0.62, topSafe=150, bottomSafe=90, decay=0.965;
  function tick(){
    bubbles.forEach(b=>{
      if(b.frozen) return; // stays exactly where clicked
      if(Math.random()<0.02){ b.vx += (Math.random()-0.5)*0.02; b.vy += (Math.random()-0.5)*0.02; }
      const speed = Math.hypot(b.vx,b.vy);
      if(speed>maxSpeed){ b.vx *= decay; b.vy *= decay; }
      b.x += b.vx; b.y += b.vy;
      const w=window.innerWidth, h=window.innerHeight;
      if(b.x-b.r<0){ b.x=b.r; b.vx*=damping; }
      if(b.x+b.r>w){ b.x=w-b.r; b.vx*=damping; }
      if(b.y-b.r<topSafe){ b.y=topSafe+b.r; b.vy*=damping; }
      if(b.y+b.r>h-bottomSafe){ b.y=h-bottomSafe-b.r; b.vy*=damping; }
      b.el.style.transform = `translate(${b.x-b.r}px, ${b.y-b.r}px)`;
    });
    if(stage!==3) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- selection ----------
  function maxForMode(){ return selectionMode==='big3' ? 3 : 8; }

  function handleBubbleClick(b, e){
    if(e && e.target && e.target.tagName==='INPUT') return; // editing in progress, don't toggle
    if(stage!==1){ toggleSelect(b); return; }
    if(b.frozen){ unfreezeBubble(b); } else { freezeBubble(b); }
  }

  function addFreezeControls(b){
    b.el.querySelectorAll('.bubble-action').forEach(o=>o.remove());
    const delBtn = document.createElement('div');
    delBtn.className='bubble-action delete';
    delBtn.textContent='✕';
    delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); removeBubble(b); });
    const editBtn = document.createElement('div');
    editBtn.className='bubble-action edit';
    editBtn.textContent='✎';
    editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); startEdit(b); });
    b.el.appendChild(delBtn);
    b.el.appendChild(editBtn);
  }

  function freezeBubble(b){
    if(b.frozen) return;
    b.frozen = true;
    b.el.classList.add('frozen');
    addFreezeControls(b);
  }

  function unfreezeBubble(b){
    b.frozen = false;
    b.el.classList.remove('frozen');
    b.el.querySelectorAll('.bubble-action').forEach(o=>o.remove());
  }

  function startEdit(b){
    b.textEl.style.display = 'none';
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'bubble-edit-input';
    inputEl.value = b.text;
    b.el.appendChild(inputEl);
    inputEl.focus();
    inputEl.select();

    function commit(){
      const newText = inputEl.value.trim();
      if(newText) b.text = newText;
      b.textEl.textContent = b.text;
      b.textEl.style.display = '';
      inputEl.remove();
      addFreezeControls(b);
      persistPending();
    }
    inputEl.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ inputEl.blur(); }
      else if(e.key==='Escape'){ inputEl.value=b.text; inputEl.blur(); }
    });
    inputEl.addEventListener('blur', commit);
  }

  function removeBubble(b){
    bubbles = bubbles.filter(x=>x.id!==b.id); // stop physics updates on it immediately
    b.el.style.opacity = '0';
    setTimeout(()=>{ b.el.remove(); }, 500);
    persistPending();
    updateStage1Gate();
  }

  function toggleSelect(b){
    if(stage===1) return; // selection only meaningful once past stage 1 view, but keep silent no-op
    if(!b.selected && selectedOrder.length>=maxForMode()) return;
    b.selected = !b.selected;
    if(b.selected){
      selectedOrder.push(b.id);
      b.el.classList.add('selected');
      const badge=document.createElement('div'); badge.className='badge'; badge.textContent=selectedOrder.length;
      b.el.appendChild(badge);
    } else {
      selectedOrder = selectedOrder.filter(id=>id!==b.id);
      b.el.classList.remove('selected');
      const badge=b.el.querySelector('.badge'); if(badge) badge.remove();
      delete placements[b.id];
      selectedOrder.forEach((id,i)=>{ const bb=bubbles.find(x=>x.id===id); const bd=bb.el.querySelector('.badge'); if(bd) bd.textContent=i+1; });
    }
    updateSelectionUI();
  }

  function updateSelectionUI(){
    if(selectionMode==='big3'){
      counterEl.textContent = `선택 ${selectedOrder.length} / 3`;
      if(selectedOrder.length===3){ nextBtn.textContent='시간 배정하기 →'; nextBtn.classList.add('show'); }
      else nextBtn.classList.remove('show');
    } else {
      counterEl.textContent = `선택 ${selectedOrder.length}개`;
      if(selectedOrder.length>=1){ nextBtn.textContent='시간 배정하기 →'; nextBtn.classList.add('show'); }
      else nextBtn.classList.remove('show');
    }
  }

  // ---------- stage transitions ----------
  nextBtn.addEventListener('click', async ()=>{
    if(stage===1 && bubbles.length>=3) goToStage2();
    else if(stage===2){
      const need = selectionMode==='big3' ? selectedOrder.length===3 : selectedOrder.length>=1;
      if(need) await goToStage3();
    }
  });

  function goToStage2(){
    bubbles.forEach(b=>{ if(b.frozen) unfreezeBubble(b); });
    stage=2; stageNum.textContent='2';
    selectionMode='big3';
    greetingWrap.classList.add('fade-out');
    inputWrap.classList.add('fade-out');
    hintText.style.opacity='0';
    instr2Head.textContent = '이 중에서, 진짜 중요한 세 가지만.';
    instr2Sub.textContent = '버블을 눌러서 골라줘';
    instruction2.classList.add('active');
    nextBtn.classList.remove('show');
    counterEl.classList.add('show');
    updateSelectionUI();
    backBtn.textContent = '← 브레인덤프로';
    backBtn.onclick = goBackToStage1;
    backBtn.classList.add('show');
  }

  function goBackToStage1(){
    stage=1; stageNum.textContent='1';
    greetingWrap.classList.remove('fade-out');
    inputWrap.classList.remove('fade-out');
    hintText.style.opacity='1';
    instruction2.classList.remove('active');
    counterEl.classList.remove('show');
    backBtn.classList.remove('show');
    updateStage1Gate();
    input.focus();
  }

  async function goToStage3(){
    stage=3; stageNum.textContent='3';
    instruction2.classList.remove('active');
    counterEl.classList.remove('show');
    nextBtn.classList.remove('show');
    bubbleLayer.style.transition='opacity .5s ease';
    bubbleLayer.style.opacity='0';
    setTimeout(()=>{ if(stage===3) bubbleLayer.style.display='none'; }, 500);
    await fetchTodaysEvents();
    buildTimeline();
    stage3.classList.add('active');
    backBtn.textContent = '← Big 3로';
    backBtn.onclick = goBackToStage2;
    backBtn.classList.add('show');
    extraBtn.classList.remove('show');
    document.getElementById('sent-msg').classList.remove('show');
  }

  function goBackToStage2(){
    stage=2; stageNum.textContent='2';
    stage3.classList.remove('active');
    bubbleLayer.style.display='block';
    requestAnimationFrame(()=>{ bubbleLayer.style.opacity='1'; });
    requestAnimationFrame(tick);
    instr2Head.textContent = selectionMode==='big3' ? '이 중에서, 진짜 중요한 세 가지만.' : '추가로, 오늘 배정할 것들을 골라줘';
    instr2Sub.textContent = '버블을 눌러서 골라줘';
    instruction2.classList.add('active');
    counterEl.classList.add('show');
    updateSelectionUI();
    backBtn.textContent = '← 브레인덤프로';
    backBtn.onclick = goBackToStage1;
  }

  function startExtraRound(){
    selectionMode='extra';
    selectedOrder = [];
    // clear any lingering selected styling from finished items (they're already removed from bubbles anyway)
    bubbles.forEach(b=>{
      if(b.selected){ b.selected=false; b.el.classList.remove('selected'); const bd=b.el.querySelector('.badge'); if(bd) bd.remove(); }
    });
    goBackToStage2();
  }
  extraBtn.addEventListener('click', startExtraRound);

  // ---------- stage 3: timeline ----------
  const timelineEl = document.getElementById('timeline');
  const timelineWrap = document.getElementById('timeline-wrap');
  const trayItemsEl = document.getElementById('tray-items');
  const confirmBtn = document.getElementById('confirm-btn');

  function minToLabel(offsetMin){
    const total = ((RANGE_START_MIN + offsetMin) % 1440 + 1440) % 1440;
    const h = Math.floor(total/60), mm = total%60;
    return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  }
  function pad2(n){ return String(n).padStart(2,'0'); }

  async function fetchTodaysEvents(){
    if(!accessToken){ todaysEvents = []; return; }
    const now = new Date();
    const rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0);
    const rangeEnd = new Date(rangeStart.getTime() + 24*60*60000); // 04:00 today -> 04:00 tomorrow
    const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
      + '?timeMin='+encodeURIComponent(rangeStart.toISOString())
      + '&timeMax='+encodeURIComponent(rangeEnd.toISOString())
      + '&singleEvents=true&orderBy=startTime';
    try{
      const res = await fetch(url, { headers:{ Authorization:'Bearer '+accessToken } });
      if(!res.ok) throw new Error('status '+res.status);
      const data = await res.json();
      todaysEvents = (data.items||[]).map(ev=>{
        if(ev.start && ev.start.date && !ev.start.dateTime){
          return { title: ev.summary || '(제목 없음)', allDay:true };
        }
        const s = new Date(ev.start.dateTime), e = new Date(ev.end.dateTime);
        const offsetStart = Math.round((s.getTime()-rangeStart.getTime())/60000);
        const offsetEnd = Math.round((e.getTime()-rangeStart.getTime())/60000);
        return {
          title: ev.summary || '(제목 없음)',
          offsetStart, offsetEnd,
          start: pad2(s.getHours())+':'+pad2(s.getMinutes()), end: pad2(e.getHours())+':'+pad2(e.getMinutes())
        };
      });
    }catch(e){
      console.warn('오늘 일정 불러오기 실패', e);
      todaysEvents = [];
    }
  }

  function buildTimeline(){
    const totalMin = DAY_END - DAY_START;
    const pxPerMin = 1.05;
    const allDayCount = todaysEvents.filter(e=>e.allDay).length;
    timelineEl.style.height = (totalMin*pxPerMin + TOP_PAD + (allDayCount?26:0) + 20)+'px';
    timelineEl.innerHTML='';

    const allDay = todaysEvents.filter(e=>e.allDay);
    if(allDay.length){
      const chipWrap = document.createElement('div');
      chipWrap.style.position='absolute'; chipWrap.style.top=TOP_PAD+'px'; chipWrap.style.left='56px'; chipWrap.style.right='10px';
      chipWrap.style.display='flex'; chipWrap.style.gap='6px'; chipWrap.style.flexWrap='wrap';
      allDay.forEach(e=>{
        const chip=document.createElement('div');
        chip.textContent='📌 '+e.title;
        chip.style.fontSize='10.5px'; chip.style.color='var(--ink-dim)';
        chip.style.background='rgba(79,167,224,0.10)'; chip.style.border='1px solid var(--bubble-border)';
        chip.style.borderRadius='999px'; chip.style.padding='3px 10px';
        chipWrap.appendChild(chip);
      });
      timelineEl.appendChild(chipWrap);
    }

    const yOffset = TOP_PAD + (allDay.length?26:0);

    for(let m=DAY_START; m<=DAY_END; m+=60){
      const top = (m-DAY_START)*pxPerMin + yOffset;
      const line=document.createElement('div'); line.className='hour-line'; line.style.top=top+'px';
      timelineEl.appendChild(line);
      const label=document.createElement('div'); label.className='hour-label'; label.style.top=top+'px'; label.textContent=minToLabel(m);
      timelineEl.appendChild(label);
    }

    todaysEvents.filter(e=>!e.allDay).forEach(e=>{
      const block=document.createElement('div'); block.className='busy-block';
      block.style.top=((e.offsetStart-DAY_START)*pxPerMin+yOffset)+'px';
      block.style.height=Math.max(18,(e.offsetEnd-e.offsetStart)*pxPerMin)+'px';
      block.textContent=e.title+' · '+e.start+'~'+e.end;
      timelineEl.appendChild(block);
    });

    trayItemsEl.innerHTML='';
    selectedOrder.forEach((id,i)=>{
      const b = bubbles.find(x=>x.id===id);
      const item = document.createElement('div');
      item.className='tray-item';
      item.dataset.id = id;
      item.innerHTML = `<span class="num">${i+1}</span>${escapeHtml(b.text)}`;
      trayItemsEl.appendChild(item);
      makeDraggable(item, id, b.text, i+1);
    });

    updateConfirmState();
  }

  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  function makeDraggable(sourceEl, id, text, num){
    let placedEl = null;
    sourceEl.addEventListener('pointerdown', startDrag);

    function startDrag(e){
      e.preventDefault();
      const originEl = placedEl || sourceEl;
      const rect = originEl.getBoundingClientRect();
      const offsetY = e.clientY - rect.top;

      const dragGhost = document.createElement('div');
      dragGhost.textContent = num+'. '+text;
      dragGhost.style.position='fixed';
      dragGhost.style.left = rect.left+'px';
      dragGhost.style.top = rect.top+'px';
      dragGhost.style.width = rect.width+'px';
      dragGhost.style.padding='8px 12px';
      dragGhost.style.background='rgba(79,167,224,0.95)';
      dragGhost.style.color='#ffffff';
      dragGhost.style.borderRadius='10px';
      dragGhost.style.fontSize='12px';
      dragGhost.style.zIndex='999';
      dragGhost.style.pointerEvents='none';
      document.body.appendChild(dragGhost);

      function move(ev){
        dragGhost.style.left = (ev.clientX - rect.width/2)+'px';
        dragGhost.style.top = (ev.clientY - offsetY)+'px';
      }
      function up(ev){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        const tlRect = timelineWrap.getBoundingClientRect();
        if(ev.clientX>=tlRect.left && ev.clientX<=tlRect.right && ev.clientY>=tlRect.top && ev.clientY<=tlRect.bottom){
          const scrollTop = timelineWrap.scrollTop;
          const relY = ev.clientY - tlRect.top + scrollTop - 40;
          const pxPerMin = 1.05;
          let startMin = DAY_START + Math.round(relY/pxPerMin/SNAP)*SNAP;
          startMin = Math.max(DAY_START, Math.min(DAY_END-30, startMin));
          const dur = (placements[id] && placements[id].durMin) || 60;
          placements[id] = { startMin, durMin: dur };
          renderPlacedBlock(id, text, num);
          sourceEl.classList.add('placed');
        } else {
          delete placements[id];
          if(placedEl){ placedEl.remove(); placedEl=null; }
          sourceEl.classList.remove('placed');
        }
        dragGhost.remove();
        updateConfirmState();
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    }

    function renderPlacedBlock(id, text, num){
      if(placedEl) placedEl.remove();
      const p = placements[id];
      const pxPerMin = 1.05;
      const yOffset = TOP_PAD + (todaysEvents.some(e=>e.allDay) ? 26 : 0);
      placedEl = document.createElement('div');
      placedEl.className='placed-block';
      placedEl.style.top = ((p.startMin-DAY_START)*pxPerMin + yOffset)+'px';
      placedEl.style.height = (p.durMin*pxPerMin)+'px';
      placedEl.innerHTML = `
        <div class="title">${num}. ${escapeHtml(text)}</div>
        <div class="time">${minToLabel(p.startMin)}~${minToLabel(p.startMin+p.durMin)}</div>
        <div class="dur-controls">
          <button class="dur-btn" data-act="minus">−</button>
          <button class="dur-btn" data-act="plus">+</button>
        </div>
      `;
      timelineEl.appendChild(placedEl);
      placedEl.addEventListener('pointerdown', (e)=>{
        if(e.target.classList.contains('dur-btn')) return;
        startDrag(e);
      });
      placedEl.querySelector('[data-act="plus"]').addEventListener('click', ()=>{
        placements[id].durMin = Math.min(240, placements[id].durMin+15);
        renderPlacedBlock(id, text, num);
      });
      placedEl.querySelector('[data-act="minus"]').addEventListener('click', ()=>{
        placements[id].durMin = Math.max(15, placements[id].durMin-15);
        renderPlacedBlock(id, text, num);
      });
    }

    // restore an existing placement (e.g., when navigating back and forth) without requiring re-drag
    if(placements[id]){
      sourceEl.classList.add('placed');
      renderPlacedBlock(id, text, num);
    }
  }

  function updateConfirmState(){
    const allPlaced = selectedOrder.every(id=>placements[id]);
    confirmBtn.disabled = !allPlaced;
  }

  confirmBtn.addEventListener('click', async ()=>{
    if(confirmBtn.disabled) return;

    if(!accessToken){
      document.getElementById('sent-note').textContent = '먼저 왼쪽 위 "구글 캘린더 연결"을 눌러서 로그인해줘';
      document.getElementById('msg-box').textContent = '';
      document.getElementById('sent-msg').classList.add('show');
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = '등록 중...';

    const ids = selectedOrder.slice();
    const items = ids.map(id=>{
      const b = bubbles.find(x=>x.id===id);
      const p = placements[id];
      return (b && p) ? {id, b, p} : null;
    }).filter(Boolean);

    const today = new Date();
    const rangeStartDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 4, 0, 0);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const results = [];

    for(const {b,p} of items){
      const start = new Date(rangeStartDate.getTime() + p.startMin*60000);
      const end = new Date(start.getTime() + p.durMin*60000);
      const body = {
        summary: b.text,
        start: { dateTime: start.toISOString(), timeZone: tz },
        end: { dateTime: end.toISOString(), timeZone: tz }
      };
      try{
        const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method:'POST',
          headers:{ 'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json' },
          body: JSON.stringify(body)
        });
        if(!res.ok){
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.error?.message || ('status '+res.status));
        }
        results.push({ ok:true, title:b.text, time: minToLabel(p.startMin)+'~'+minToLabel(p.startMin+p.durMin) });
      }catch(e){
        results.push({ ok:false, title:b.text, error:e.message });
      }
    }

    const doneIds = items.map(it=>it.id);
    bubbles = bubbles.filter(bb=>!doneIds.includes(bb.id));
    doneIds.forEach(id=>{ delete placements[id]; });
    selectedOrder = selectedOrder.filter(id=>!doneIds.includes(id));
    persistPending();

    const okCount = results.filter(r=>r.ok).length;
    document.getElementById('msg-box').textContent = results.map(r =>
      r.ok ? `✓ ${r.title} (${r.time})` : `✗ ${r.title} — 실패: ${r.error}`
    ).join('\n');
    document.getElementById('sent-note').textContent = okCount===results.length
      ? '캘린더에 모두 등록했어'
      : `${okCount}/${results.length}개만 등록됐어 — 아래에서 실패한 항목 확인`;
    document.getElementById('sent-msg').classList.add('show');
    confirmBtn.textContent = '구글 캘린더에 반영하기';

    if(okCount < results.length){
      confirmBtn.disabled = false;
    } else if(bubbles.length > 0){
      extraBtn.classList.add('show');
    }
  });

  document.getElementById('copy-btn').addEventListener('click', ()=>{
    const text = document.getElementById('msg-box').textContent;
    const btn = document.getElementById('copy-btn');
    navigator.clipboard.writeText(text).then(()=>{
      btn.textContent='복사됨 ✓'; btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent='문구 복사하기'; btn.classList.remove('copied'); }, 2000);
    }).catch(()=>{
      btn.textContent='복사 실패 — 직접 드래그해서 복사해줘';
    });
  });

  restartBtn.addEventListener('click', ()=>{
    // "처음부터" only resets the current in-progress selection/timeline —
    // it must NOT delete brainstormed bubbles or their saved storage.
    selectedOrder.forEach(id=>{
      const b = bubbles.find(x=>x.id===id);
      if(b){ b.selected=false; b.el.classList.remove('selected'); const bd=b.el.querySelector('.badge'); if(bd) bd.remove(); }
    });
    selectedOrder=[]; placements={}; selectionMode='big3';
    stage=1; stageNum.textContent='1';
    greetingWrap.classList.remove('fade-out');
    inputWrap.classList.remove('fade-out');
    hintText.style.opacity='1';
    instruction2.classList.remove('active');
    stage3.classList.remove('active');
    bubbleLayer.style.display='block';
    bubbleLayer.style.opacity='1';
    nextBtn.classList.remove('show');
    counterEl.classList.remove('show');
    counterEl.textContent='선택 0 / 3';
    backBtn.classList.remove('show');
    extraBtn.classList.remove('show');
    document.getElementById('sent-msg').classList.remove('show');
    input.value=''; input.focus();
    requestAnimationFrame(tick);
    updateStage1Gate();
  });
